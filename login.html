<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Client Portal — Atelier </title>
<meta name="description" content="Atelier  client and team portal login." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-body">

<!-- ============ NAV (minimal) ============ -->
<header class="topbar login-top">
  <a href="index.html" class="brand">
    <img 
     src="images/logooi.webp" 
     alt="Stackly  Architecture"
     class="brand-logo"
    >
  </a>
  <a href="index.html" class="login-back">← Back to site</a>
</header>

<!-- ============ LOGIN ============ -->
<main class="login-stage">
  <div class="login-bg"></div>

  <!-- close button -->
  <a href="index.html" class="login-close" aria-label="Close login">
    <span></span><span></span>
  </a>

  <div class="login-card reveal in">
    <!-- visual side -->
    <div class="login-visual">
      <div class="lv-grid"></div>
      <div class="lv-content">
        <p class="eyebrow">Atelier  Portal</p>
        <h2>Where the<br />drawings live.</h2>
        <p>Review progress, comment on drawings, and watch your building take shape — one revision at a time.</p>
        <div class="lv-foot">
          <span>SECURE</span>
          <span>EST. 2008</span>
        </div>
      </div>
    </div>

    <!-- form side -->
    <div class="login-form-side">
      <h1>Welcome back.</h1>
      <p class="login-sub">Sign in to your portal below.</p>

      <!-- role selector -->
      <div class="role-select" id="roleSelect">
        <button type="button" class="role active" data-role="client">
          <span class="role-ic">
            <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zM2 22a10 10 0 0120 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <span class="role-tx"><b>Client</b><i>Project owner</i></span>
        </button>
        <button type="button" class="role" data-role="architect">
          <span class="role-ic">
            <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </span>
          <span class="role-tx"><b>Architect</b><i>Studio team</i></span>
        </button>
      </div>

      <form id="loginForm" novalidate>
        <label class="lf-field">
          <span>Email</span>
          <input type="email" name="email" required placeholder="you&#64;email.com" />
        </label>
        <label class="lf-field">
          <span>Password</span>
          <div class="lf-pw">
            <input type="password" name="password" required placeholder="••••••••" />
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">SHOW</button>
          </div>
        </label>
        <div class="lf-row">
          <label class="lf-check"><input type="checkbox" name="remember" /> <span>Remember me</span></label>
          <a href="#" class="lf-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-solid lf-submit">Sign in as <em id="roleLabel">Client</em> <span class="arrow">&rarr;</span></button>
        <p class="lf-status" id="lfStatus" role="status"></p>
      </form>

      <p class="lf-foot">No account? <a href="signup.html">Create account</a></p>
    </div>
  </div>
</main>

<script src="js/theme.js"></script>
<script src="js/login.js"></script>
</body>
</html>
